schema_version: "1.1"
name: new-scene-fits-15s
expected_outcome: |
  A new Director Console 3D project for the three-cut bus-stop script: a sidewalk set with a bus stop,
  the two leads blocked per the script, passers-by and traffic that are always in motion, one camera per
  CUT with cuts in order, dialogue as markers, total length 15 s or less (the script's estimates add up
  to 24 s), generated from a build script kept in the repo, checked, and exported to MP4. The reply is in
  Traditional Chinese with a per-shot timing table.
